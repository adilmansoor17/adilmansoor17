<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="title description">
  <title id="title">Adil Mansoor Ahmad</title>
  <desc id="description">Senior Full Stack Engineer specializing in SaaS, cloud, real-time systems, and AI integrations.</desc>

  <style>
    .background { fill: #ffffff; }
    .border { stroke: #d8dee4; }
    .name { fill: #0f172a; }
    .role { fill: #475569; }
    .detail { fill: #64748b; }

    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .border { stroke: #30363d; }
      .name { fill: #f0f6fc; }
      .role { fill: #c9d1d9; }
      .detail { fill: #8b949e; }
    }
  </style>

  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.15" />
      <animate attributeName="x1" values="-100%;100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="7s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <rect class="background border" x="1" y="1" width="898" height="198" rx="18" stroke-width="2" />

  <text class="name" x="450" y="73" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.7">
    Adil Mansoor Ahmad
  </text>
  <text class="role" x="450" y="112" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600">
    Senior Full Stack Engineer
  </text>
  <text class="detail" x="450" y="143" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" letter-spacing="0.4">
    SaaS · Cloud · Real-time Systems · AI/LLM
  </text>

  <rect x="255" y="165" width="390" height="3" rx="1.5" fill="url(#accent)" />
</svg>
